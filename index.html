<!DOCTYPE html>
<html lang="de">
<head>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kreisläufer Pro</title>
<style>
:root{--bg:#0b0f0d;--card:#141a17;--line:#222b27;--tx:#f2f6f4;--mu:#8a978f;--ac:#3ddc84;--ac2:#06210f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6f4;--card:#fff;--line:#dde5e0;--tx:#0f1a14;--mu:#5d6b63;--ac:#12a150;--ac2:#fff;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0b0f0d;--card:#141a17;--line:#222b27;--tx:#f2f6f4;--mu:#8a978f;--ac:#3ddc84;--ac2:#06210f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:28px;margin:8px 0 2px}h2{font-size:22px;margin:8px 0 2px}h3{margin:18px 0 8px;font-size:16px}
.mu{color:var(--mu);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:13px;margin:8px 0;font:inherit;cursor:pointer}
.item b{display:block}.ico{width:36px;flex:none;color:var(--ac);display:grid;place-items:center}
.btn{display:block;width:100%;background:var(--ac);color:var(--ac2);border:0;border-radius:24px;padding:14px;font:600 16px system-ui;margin:14px 0;cursor:pointer}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--ac2);font-size:15px}
.chk.on{background:var(--ac);border-color:var(--ac)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.week div{text-align:center;padding:8px 0;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.week small{display:block;font-size:10px;opacity:.8}.week .t{background:var(--ac);color:var(--ac2);font-weight:700}.week .f{border-color:var(--ac)}
.hero{border-radius:16px;padding:22px 18px;background:linear-gradient(135deg,#0f3d22,var(--card) 70%);border:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.5px;color:var(--ac)}
.top button,.back{background:none;border:0;color:var(--tx);cursor:pointer;padding:4px}
.back{font-size:24px;padding:4px 8px 4px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:12px system-ui;padding:6px 0;cursor:pointer}
nav button svg{display:block;margin:0 auto 2px}nav .on{color:var(--ac)}
.bar{height:9px;border-radius:5px;background:var(--bg);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac)}textarea,input[type=text]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{text-align:center;margin:0}.stats b{font-size:22px;display:block;color:var(--ac)}
.fig{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0}.fig svg{display:block;width:100%;height:auto}
.hero2{position:relative;overflow:hidden;border-radius:20px;padding:22px 18px 20px;background:radial-gradient(circle at 85% 10%,rgba(61,220,132,.3),transparent 55%),linear-gradient(160deg,rgba(61,220,132,.22),var(--card) 75%);border:1px solid var(--line);margin-top:12px}.hero2 .bg{position:absolute;right:-30px;top:-20px;width:170px;opacity:.2;color:var(--ac)}.hero2 h1{position:relative;font-size:30px;line-height:1.1;margin:6px 0 0}.today{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--ac);border-radius:18px;padding:16px;margin:14px 0}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:12px;color:var(--mu)}.mini b{display:block;font-size:18px;color:var(--tx);margin-bottom:2px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>

function pl(p,anc){var r=Math.PI/180,s=function(a){return Math.sin(a*r)},c=function(a){return Math.cos(a*r)},L=function(q,a,l){return[q[0]+l*s(a),q[1]+l*c(a)]},

if(v=="plan"){h=hdr()+'<h2>Wochenplan</h2><div class="mu">Dein Trainingsplan auf einen Blick.</div>'+PLAN.map(function(p,i){return '<button class="item" onclick="go(\'day\','+i+')"><span class="ico">'+svg(IC[p.i],28)+'</span><span style="flex:1"><b>'+DAYS[i]+'</b><span class="mu">'+p.t+'</span></span>'+ck(S.fin[dayDate(i)])+'</button>'}).join("")}

h='<div class="row"><button class="back" onclick="go(\'plan\')">←</button><h2>'+DAYS[sd]+' – '+p.t+'</h2></div><div class="mu">'+p.m+'</div><p class="mu">'+n+' von '+p.ex.length+' erledigt</p>'

+'<button class="btn" onclick="fin('+sd+')">'+(S.fin[d]?'Training wieder öffnen':'Training abschließen')+'</button>'}
if(v=="ex"){var p=PLAN[sd],e=p.ex[se],d=dayDate(sd),on=S.done[d+"|"+se];
h='<div class="row"><button class="back" onclick="go(\'day\','+sd+')">←</button><b>Übung</b></div><div class="fig">'+fig(e[5])+'</div><h2>'+e[0]+'</h2><div class="card"><b>'+e[1]+'</b> <span class="mu">· '+e[2]+'</span></div><p>'+e[3]+'</p><div class="card">💡 <b>Tipp</b><br>'+e[4]+'</div>'

if(v=="prog"){var wk=0;for(var i=0;i<7;i++)if(S.fin[dayDate(i)])wk++;var c={kraft:0,hb:0,spiel:0};
for(var k in S.fin){if(!S.fin[k])continue;var q=k.split("-"),g=new Date(+q[0],+q[1]-1,+q[2]),pk=PLAN[(g.getDay()+6)%7].k;if(c[pk]!=null)c[pk]++}
var o=326.7*(1-wk/7);
h=hdr()+'<h2>Fortschritt</h2><div class="mu">Deine Entwicklung. Schritt für Schritt.</div><div style="text-align:center;margin:16px 0"><svg width="140" height="140" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="'+o+'" transform="rotate(-90 60 60)"/><text x="60" y="62" text-anchor="middle" fill="var(--tx)" font-size="24" font-weight="700">'+wk+'/7</text><text x="60" y="80" text-anchor="middle" fill="var(--mu)" font-size="9">Trainingstage diese Woche</text></svg></div>'
+'<div class="stats"><div class="card"><b>'+c.kraft+'</b><span class="mu">Krafteinheiten</span></div><div class="card"><b>'+c.hb+'</b><span class="mu">Handballtraining</span></div><div class="card"><b>'+c.spiel+'</b><span class="mu">Spiele</span></div></div><h3>Letzte 4 Wochen</h3><div class="card">';
for(var w=3;w>=0;w--){var f=0;for(var i=0;i<7;i++)if(S.fin[dayDate(i,w)])f++;var pc=Math.round(f/7*100);h+='<div class="row sp"><span>'+(w==0?'Diese Woche':'Vor '+w+' Woche'+(w>1?'n':''))+'</span><b>'+pc+' %</b></div><div class="bar"><i style="width:'+pc+'%"></i></div>'}
h+='</div>'}
if(v=="rec"){var d=dayDate(ti),c=S.chk[d]||{s:8,e:7,m:2,st:8,n:""};
h=hdr()+'<h2>Erholung</h2><div class="mu">Gib deinem Körper, was er braucht.</div><div class="card"><b>Tages-Check-in</b> <span class="mu">· '+now.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"long",year:"numeric"})+'</span>'
+sl("Schlaf (Stunden)","s",0,12,c.s)+sl("Energie (1–10)","e",1,10,c.e)+sl("Muskelkater (1–10)","m",1,10,c.m)+sl("Stimmung (1–10)","st",1,10,c.st)
+'<p class="mu">Notizen (optional)</p><textarea id="nt" rows="3" placeholder="Wie fühlst du dich heute?"></textarea><button class="btn" id="sb" onclick="svc()">Speichern</button></div><div class="card">💡 <b>Tipps für heute</b><br>Leichte Bewegung, viel trinken und früh schlafen – so bleibst du fit für dein nächstes Training.</div><h3>Verlauf</h3><div id="hs">'+hist()+'</div>'}
if(v=="prof"){h='<div class="row"><button class="back" onclick="go(\'home\')">←</button><h2>Mein Profil</h2></div><div class="card"><p class="mu" style="margin:0">Name</p><input type="text" id="nm"><p class="mu">Position: Kreisläufer</p></div><h3>Ziele</h3>'+GOALS.map(function(g,i){return '<button class="item" onclick="gl('+i+')">'+ck(S.goals[i])+g+'</button>'}).join("")+'<p class="mu" style="text-align:center;margin-top:20px">„Kleine Schritte, große Ziele.“</p><p class="mu" style="text-align:center">Deine Daten bleiben nur auf diesem Gerät.</p>'}
if(v=="home")h=homeHTML();a.innerHTML=h;
if(v=="rec"){var c2=S.chk[dayDate(ti)];if(c2)$("#nt").value=c2.n||""}
if(v=="prof"){var n=$("#nm");n.value=S.name;n.onchange=function(){S.name=n.value;sv()}}}
function sl(l,k,a,b,x){return '<p class="mu" style="margin-bottom:0">'+l+': <b id="o'+k+'">'+x+'</b></p><input type="range" id="r'+k+'" min="'+a+'" max="'+b+'" value="'+x+'" oninput="document.getElementById(\'o'+k+'\').textContent=this.value">'}
function svc(){var g=function(k){return +$("#r"+k).value};S.chk[dayDate(ti)]={s:g("s"),e:g("e"),m:g("m"),st:g("st"),n:$("#nt").value};var ok=sv();$("#sb").textContent=ok?"Gespeichert ✓":"Nur bis zum Schließen gespeichert";$("#hs").innerHTML=hist()}
function tg(d,e){var k=dayDate(d)+"|"+e;S.done[k]=!S.done[k];sv();go("day",d)}
function fin(d){var k=dayDate(d);S.fin[k]=!S.fin[k];sv();go("plan")}
function gl(i){S.goals[i]=!S.goals[i];sv();draw()}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function hist(){var ks=Object.keys(S.chk).sort().reverse().slice(0,14);if(!ks.length)return '<p class="mu">Noch keine Check-ins gespeichert.</p>';
var l=ks.slice(0,7),av=function(f){return (l.reduce(function(s,k){return s+S.chk[k][f]},0)/l.length).toFixed(1).replace(".",",")};
var o='<div class="mini" style="margin-bottom:8px"><div><b>'+av("s")+' h</b>Ø Schlaf</div><div><b>'+av("e")+'</b>Ø Energie</div><div><b>'+av("m")+'</b>Ø Muskelkater</div></div>';
ks.forEach(function(k){var c=S.chk[k];o+='<div class="card"><b>'+new Date(k+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"long"})+'</b><div class="mu">Schlaf '+c.s+' h · Energie '+c.e+'/10 · Muskelkater '+c.m+'/10 · Stimmung '+c.st+'/10</div>'+(c.n?'<div style="margin-top:6px">'+esc(c.n)+'</div>':'')+'</div>'});return o}
function homeHTML(){var p=PLAN[ti],d=dayDate(ti),n=0,tot=p.ex.length,wk=0,i;
p.ex.forEach(function(e,j){if(S.done[d+"|"+j])n++});for(i=0;i<7;i++)if(S.fin[dayDate(i)])wk++;
var pc=Math.round(n/tot*100),hr=now.getHours(),g=hr<11?"Guten Morgen":hr<18?"Hallo":"Guten Abend",bt=S.fin[d]?"Heute erledigt ✓":n?"Weitermachen":p.k=="rest"?"Erholung ansehen":"Training starten";
return hdr()+'<div class="hero2"><svg class="bg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=".8">'+IC.ball+'</svg><div class="mu" style="position:relative">'+now.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})+'</div><h1>'+g+',<br>Kreisläufer.</h1><p class="mu" style="position:relative;margin:8px 0 0">Stark im Kopf. Stark im Körper. Stark im Spiel.</p></div>'
+'<div class="today"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--ac)" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="'+(163.4*(1-pc/100))+'" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" fill="var(--tx)" font-size="15" font-weight="700">'+n+'/'+tot+'</text></svg><div style="flex:1"><div class="mu">HEUTE</div><b style="font-size:18px">'+p.t+'</b><div class="mu">'+p.m+'</div></div></div><button class="btn" style="margin-top:0" onclick="go(\'day\','+ti+')">'+bt+'</button>'
+'<div class="mini"><div><b>'+wk+'/7</b>Diese Woche</div><div onclick="go(\'rec\')"><b>'+(S.chk[d]?"✓":"–")+'</b>Check-in</div><div><b>'+AB[(ti+1)%7]+'</b>'+LB[(ti+1)%7]+'</div></div>'
+'<div class="card"><b>Deine Woche</b><div class="week">'+AB.map(function(n,i){return '<div class="'+(i==ti?'t':'')+(S.fin[dayDate(i)]?' f':'')+'" onclick="go(\'day\','+i+')">'+n+'<small>'+LB[i]+'</small>'+(S.fin[dayDate(i)]?'✓':'·')+'</div>'}).join("")+'</div></div><p class="mu" style="text-align:center;margin-top:24px">„Disziplin ist der Schlüssel zu deinem nächsten Level.“</p>'}
ld();draw();
</script>
<div id="rt" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--card,#141a17);border:1px solid var(--line,#222b27);color:var(--tx,#f2f6f4);border-radius:20px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.4);align-items:center;gap:14px;font:600 16px system-ui">
  <span>Pause</span>
  <b id="rtt" style="font-size:28px;color:var(--ac,#3ddc84);min-width:64px;text-align:center">0:00</b>
  <button id="rtp" style="background:none;border:1px solid var(--line,#222b27);color:inherit;border-radius:12px;padding:6px 10px;font:inherit">+15s</button>
  <button id="rts" style="background:var(--ac,#3ddc84);border:0;color:var(--ac2,#062112);border-radius:12px;padding:6px 12px;font:inherit">Stopp</button>
</div>
<script>
(function(){
  var PAUSE = 90; /* Sekunden, hier änderbar */
  var box=document.getElementById('rt'), out=document.getElementById('rtt');
  var end=0, timer=null, last=-1, ctx=null;

  function audio(){
    try{
      if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
    }catch(e){}
  }
  document.addEventListener('click', audio);

  function beep(freq, dur){
    if(!ctx) return;
    try{
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
      o.start(); o.stop(ctx.currentTime+dur);
    }catch(e){}
  }

  function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

  function stop(){ clearInterval(timer); timer=null; box.style.display='none'; }

  function tick(){
    var rem=Math.ceil((end-Date.now())/1000);
    if(rem<=0){
      out.textContent='0:00';
      beep(880,0.25); setTimeout(function(){beep(1320,0.5);},300);
      clearInterval(timer); timer=null;
      setTimeout(stop,2000);
      return;
    }
    out.textContent=fmt(rem);
    if(rem!==last && rem<=3) beep(660,0.15);
    last=rem;
  }

  window.startPause=function(sec){
    audio();
    end=Date.now()+(sec||PAUSE)*1000; last=-1;
    box.style.display='flex';
    clearInterval(timer); tick(); timer=setInterval(tick,250);
  };

  document.getElementById('rtp').onclick=function(){ end+=15000; };
  document.getElementById('rts').onclick=stop;

  /* automatisch starten, wenn ein Haken gesetzt wird */
  new MutationObserver(function(list){
    list.forEach(function(m){
      var el=m.target, was=(m.oldValue||'').split(' ').indexOf('on')>-1;
      if(el.classList && el.classList.contains('chk') && el.classList.contains('on') && !was){
        window.startPause();
      }
    });
  }).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class'],attributeOldValue:true});
})();
</script>
